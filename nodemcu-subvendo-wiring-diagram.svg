<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="Arial, Helvetica, sans-serif">
  <!-- Background (dark, so the white signal wire is clearly visible) -->
  <rect width="1300" height="800" fill="#1e293b"/>

  <!-- Title -->
  <text x="650" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#f8fafc">NODEMCU SUB-VENDO + COIN SLOT WIRING DIAGRAM</text>
  <text x="650" y="72" text-anchor="middle" font-size="15" fill="#94a3b8">RJD PisoWiFi — Coin Signal on NodeMCU Pin D6 (GPIO12) · 12V Supply via Buck Converter to 5V</text>

  <!-- ================= 12V POWER SUPPLY ================= -->
  <rect x="40" y="300" width="190" height="150" rx="8" fill="#111827" stroke="#000" stroke-width="2"/>
  <text x="135" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">12V DC</text>
  <text x="135" y="380" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">POWER SUPPLY</text>
  <!-- terminals -->
  <circle cx="230" cy="335" r="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="230" cy="415" r="8" fill="#111827" stroke="#666" stroke-width="2"/>
  <text x="212" y="322" font-size="13" font-weight="bold" fill="#dc2626">+12V</text>
  <text x="214" y="442" font-size="13" font-weight="bold" fill="#cbd5e1">GND</text>

  <!-- ================= COIN SLOT ================= -->
  <rect x="340" y="110" width="210" height="170" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="445" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">COIN SLOT</text>
  <text x="445" y="172" text-anchor="middle" font-size="14" fill="#4b5563">(Coin Acceptor)</text>
  <circle cx="445" cy="215" r="18" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <!-- terminals left -->
  <circle cx="340" cy="145" r="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="340" cy="245" r="7" fill="#111827" stroke="#666" stroke-width="2"/>
  <text x="352" y="140" font-size="12" font-weight="bold" fill="#dc2626">+12V</text>
  <text x="352" y="262" font-size="12" font-weight="bold" fill="#1f2937">GND</text>
  <!-- signal terminal right -->
  <circle cx="550" cy="195" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="500" y="270" font-size="12" font-weight="bold" fill="#b45309">SIGNAL</text>

  <!-- ================= BUCK CONVERTER ================= -->
  <rect x="340" y="520" width="210" height="120" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="445" y="565" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">BUCK CONVERTER</text>
  <text x="445" y="588" text-anchor="middle" font-size="13" fill="#dbeafe">Step-Down 12V → 5V</text>
  <!-- input terminals -->
  <circle cx="340" cy="550" r="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="340" cy="610" r="7" fill="#111827" stroke="#666" stroke-width="2"/>
  <text x="352" y="545" font-size="12" font-weight="bold" fill="#fff">VIN+</text>
  <text x="352" y="630" font-size="12" font-weight="bold" fill="#fff">VIN−</text>
  <!-- output terminals -->
  <circle cx="550" cy="550" r="7" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <circle cx="550" cy="610" r="7" fill="#111827" stroke="#666" stroke-width="2"/>
  <text x="495" y="545" font-size="12" font-weight="bold" fill="#dcfce7">VOUT+ 5V</text>
  <text x="505" y="630" font-size="12" font-weight="bold" fill="#dcfce7">VOUT−</text>

  <!-- ================= NODEMCU ================= -->
  <rect x="880" y="140" width="260" height="420" rx="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="3"/>
  <text x="1010" y="180" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">NODEMCU</text>
  <text x="1010" y="202" text-anchor="middle" font-size="13" fill="#bfdbfe">ESP8266 SUB-VENDO</text>
  <!-- USB port top -->
  <rect x="975" y="128" width="70" height="26" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="1010" y="118" text-anchor="middle" font-size="11" fill="#94a3b8">micro-USB (alt. 5V in)</text>
  <!-- ESP module -->
  <rect x="940" y="220" width="140" height="90" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="1010" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">ESP-12E</text>
  <!-- LEFT pin column labels -->
  <g font-size="11" fill="#e2e8f0">
    <text x="892" y="330">A0</text>
    <text x="892" y="352">RSV</text>
    <text x="892" y="374">RSV</text>
    <text x="892" y="396">SD3</text>
    <text x="892" y="418">SD2</text>
    <text x="892" y="440">SD1</text>
    <text x="892" y="462">CMD</text>
    <text x="892" y="484">SD0</text>
    <text x="892" y="506">CLK</text>
    <text x="888" y="528">GND</text>
    <text x="888" y="550">3V3</text>
  </g>
  <!-- RIGHT pin column labels -->
  <g font-size="11" fill="#e2e8f0">
    <text x="1102" y="330">D0</text>
    <text x="1102" y="352">D1</text>
    <text x="1102" y="374">D2</text>
    <text x="1102" y="396">D3</text>
    <text x="1102" y="418">D4</text>
    <text x="1102" y="440">D5</text>
    <text x="1102" y="462" font-weight="bold" font-size="13">D6</text>
    <text x="1102" y="484">D7</text>
    <text x="1102" y="506">D8</text>
    <text x="1100" y="528">RX</text>
    <text x="1100" y="550">TX</text>
  </g>
  <!-- pin pads right column -->
  <g fill="#fbbf24">
    <circle cx="1128" cy="326" r="5"/><circle cx="1128" cy="348" r="5"/>
    <circle cx="1128" cy="370" r="5"/><circle cx="1128" cy="392" r="5"/>
    <circle cx="1128" cy="414" r="5"/><circle cx="1128" cy="436" r="5"/>
    <circle cx="1128" cy="458" r="5"/><circle cx="1128" cy="480" r="5"/>
    <circle cx="1128" cy="502" r="5"/><circle cx="1128" cy="524" r="5"/>
    <circle cx="1128" cy="546" r="5"/>
  </g>
  <!-- VIN pin at bottom area -->
  <circle cx="886" cy="568" r="5" fill="#fbbf24"/>
  <text x="896" y="573" font-size="11" font-weight="bold" fill="#e2e8f0">VIN (5V in)</text>
  <!-- highlight D6 -->
  <circle cx="1128" cy="458" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="1035" y="455" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">PIN D6 (GPIO12)</text>
  <text x="1035" y="472" font-size="11" fill="#bfdbfe" text-anchor="end">COIN SIGNAL IN</text>

  <!-- ================= WIRES ================= -->
  <!-- +12V red: supply -> coin slot and buck VIN+ -->
  <path d="M238,335 H290 V145 H333" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M290,335 V550 H333" fill="none" stroke="#dc2626" stroke-width="5"/>
  <!-- GND black: supply -> coin slot and buck VIN- -->
  <path d="M238,415 H270 V245 H333" fill="none" stroke="#111827" stroke-width="5" stroke-opacity="0.9"/>
  <path d="M270,415 V610 H333" fill="none" stroke="#111827" stroke-width="5"/>
  <!-- Coin signal WHITE: coin slot SIGNAL -> NodeMCU D6 -->
  <path d="M557,195 H740 V458 H1119" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="600" y="185" font-size="14" font-weight="bold" fill="#f8fafc">COIN PULSE SIGNAL</text>
  <!-- 5V green: buck VOUT+ -> NodeMCU VIN -->
  <path d="M557,550 H640 V700 H850 V568 H879" fill="none" stroke="#16a34a" stroke-width="5"/>
  <!-- buck VOUT- black -> shared at supply GND (same supply, ground already common) -->
  <path d="M557,610 H620 V680 H830 V568" fill="none" stroke="#111827" stroke-width="4"/>
  <text x="660" y="725" font-size="14" font-weight="bold" fill="#4ade80">+5V → VIN (or micro-USB)</text>

  <!-- Wire legend -->
  <g font-size="13">
    <rect x="60" y="690" width="24" height="10" fill="#dc2626"/><text x="92" y="700" fill="#e2e8f0">+12V power</text>
    <rect x="210" y="690" width="24" height="10" fill="#111827" stroke="#64748b" stroke-width="1"/><text x="242" y="700" fill="#e2e8f0">GND (0V)</text>
    <rect x="340" y="690" width="24" height="10" fill="#ffffff"/><text x="372" y="700" fill="#e2e8f0">Coin pulse signal</text>
    <rect x="520" y="690" width="24" height="10" fill="#16a34a"/><text x="552" y="700" fill="#e2e8f0">+5V to NodeMCU</text>
  </g>

  <!-- Info note -->
  <text x="60" y="745" font-size="13" font-weight="bold" fill="#4ade80">ℹ No extra GND wire to NodeMCU needed: coin slot and buck converter share the same 12V supply, ground is common.</text>
</svg>
