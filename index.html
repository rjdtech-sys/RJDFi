    <title>RJD PISOWIFI - Access Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Local Tailwind CSS (Offline Support) -->
    <script src="/dist/tailwind.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { 
              primary: 'var(--primary)',
              slate: { 
                50: 'var(--bg)', 
                100: 'var(--slate-100)', 
                200: 'var(--border)', 
                400: 'var(--text-muted)', 
                500: 'var(--text-muted)', 
                600: 'var(--text-muted)', 
                900: 'var(--text-main)', 
                950: 'var(--text-main)' 
              },
              blue: {
                100: 'rgba(var(--primary), 0.1)',
                500: 'var(--primary)',
                600: 'var(--primary)',
                700: 'var(--primary-dark)'
              },
              white: 'var(--bg-card)',
              black: 'var(--bg)' // Inverted for dark mode logic often
            },
            borderRadius: { '4xl': '2rem', '5xl': '3rem' }
          }
        }
      }
    </script>
    <script>
      // Instant Theme Restore
      (function() {
        try {
          var theme = localStorage.getItem('rjd_pisowifi_theme') || 'default';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      
      body { 
        font-family: var(--font-main); 
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.5;
        min-height: 100vh;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* INSTANT SPLASH SCREEN */
      #splash {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(var(--shadow-color), 0.1);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-10px); }
      }
      
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(100%); }
        to { opacity: 1; transform: translateX(0); }
      }
      
      @keyframes slideOutRight {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(100%); }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      
      .animate-fade-out {
        animation: fadeOut 0.3s ease-out;
      }
      
      .animate-slide-in-right {
        animation: slideInRight 0.3s ease-out;
      }
      
      .animate-slide-out-right {
        animation: slideOutRight 0.3s ease-out;
      }
      #splash p { color: var(--text-main); font-weight: 900; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }

      /* Core Layout Engine (Mimics Tailwind if CDN is missing) */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .text-center { text-align: center; }
      .w-full { width: 100%; }
      .min-h-screen { min-height: 100vh; }
      .p-8 { padding: 2rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .mb-8 { margin-bottom: 2rem; }
      .rounded-3xl { border-radius: var(--radius-lg); }
      .shadow-xl { box-shadow: 0 20px 25px -5px rgba(var(--shadow-color), 0.1), 0 10px 10px -5px rgba(var(--shadow-color), 0.04); }
      .uppercase { text-transform: uppercase; }
      .font-black { font-weight: 900; }
      
      /* Portal Specific Components */
      .portal-container { min-height: 100vh; padding-bottom: 3rem; background: var(--bg); }
      
      .portal-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        padding: 4rem 2rem 6rem 2rem;
        text-align: center;
        color: white;
        border-bottom-left-radius: 50px;
        border-bottom-right-radius: 50px;
        box-shadow: 0 20px 40px rgba(var(--shadow-color), 0.25);
        position: relative;
      }
      
      /* Terminal Theme Overrides for Header */
      :root[data-theme="terminal"] .portal-header {
        background: var(--bg);
        border-bottom: 2px solid var(--primary);
        border-radius: 0;
        box-shadow: none;
        color: var(--primary);
      }

      .portal-card {
        background: var(--bg-card);
        margin: -3rem 1.5rem 2rem 1.5rem;
        border: 1px solid var(--border);
        padding: 2.5rem;
        border-radius: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        text-align: center;
        border: 1px solid rgba(226, 232, 240, 0.6);
        position: relative;
        z-index: 50;
      }

      .portal-btn {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: white;
        padding: 1.5rem 2rem;
        border-radius: 24px;
        font-weight: 900;
        text-transform: uppercase;
        border: none;
        width: 100%;
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        box-shadow: 0 15px 30px rgba(37, 99, 235, 0.35);
        cursor: pointer;
        display: block;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .portal-btn:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }

      .rates-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.25rem;
        padding: 0 1.5rem;
        margin-bottom: 2.5rem;
      }

      .rate-item {
        background: white;
        padding: 1.5rem 1rem;
        border-radius: 30px;
        text-align: center;
        border: 1px solid #f1f5f9;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      }

      .rate-pesos { font-size: 1.875rem; font-weight: 900; color: var(--slate-900); display: block; }
      .rate-time { font-size: 0.65rem; font-weight: 900; color: var(--primary); text-transform: uppercase; margin-top: 0.5rem; display: block; letter-spacing: 0.1em; }

      #root { min-height: 100vh; }

      /* Modal Specifics */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 9999;
      }
      .modal-content {
        background: white;
        width: 100%;
        max-width: 360px;
        border-radius: 48px;
        overflow: hidden;
      }
